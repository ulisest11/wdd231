<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" role="img" aria-label="Logo Panajachel">
  <!-- Lake blue background circle -->
  <circle cx="50" cy="50" r="50" fill="#1a5276"/>
  <!-- Volcano silhouette -->
  <polygon points="50,15 72,60 28,60" fill="#0f3460"/>
  <polygon points="35,60 65,60 80,80 20,80" fill="#0f3460"/>
  <!-- Lake shimmer -->
  <ellipse cx="50" cy="82" rx="30" ry="8" fill="#2980b9" opacity="0.7"/>
  <!-- Snow cap -->
  <polygon points="50,15 57,32 43,32" fill="white" opacity="0.9"/>
  <!-- Sun -->
  <circle cx="75" cy="25" r="8" fill="#f39c12"/>
</svg>
